# ---------------------------------------------------------------------------------------------
# Map PeroDesign library materials to priced items. A layer whose material has no mapping here makes
# the engine report the design cost as INCOMPLETE (never zero).
# density_from: derive g/cm3 as consumption / (reference_thickness x 1 m2). This is the mass the source
# actually budgets per volume (precursor + waste inside `utilisation`), not a crystallographic density.
layer_materials:
  C60:
    item: C60
    density_from: {mass: liu_c60_mass, thickness: liu_c60_thickness}
    price: liu_c60_price
    utilisation: liu_c60_util
  MAPbI3:
    item: perovskite
    proxy_for: "Liu 2025 prices an unspecified production perovskite, not MAPbI3"
    density_from: {mass: liu_perovskite_mass, thickness: liu_perovskite_thickness}
    price: liu_perovskite_price
    utilisation: liu_perovskite_util
  NiOx:
    item: NiOx
    volume_price: {price: liu_nio_price, utilisation: liu_nio_util, check: {volume: liu_nio_vol, thickness: liu_nio_thickness}}
    notes: "Liu prices NiOx per cm3 of film (0.015 cm3 per m2 at 15 nm = exactly 15 nm x 1 m2); cost scales with thickness"
  SnO2:
    item: SnOx
    volume_price: {price: liu_sno_price, utilisation: liu_sno_util, check: {volume: liu_sno_vol, thickness: liu_sno_thickness}}
    notes: "Liu prices SnOx (RPD) per cm3 of film (0.01 cm3 per m2 at 10 nm)"
  PTAA:
    item: PTAA
    density: null              # no open-access source found (searched 2026-09-28): caller must supply assumption 'density:PTAA'
    price: ptaa_price_review_2022
    price_high: ptaa_price_catalogue_2017
    utilisation: liu_perovskite_util
    proxy_for: "LAB-CATALOGUE price (arbitrary per source); utilisation proxied by Liu's slot-die perovskite (0.95)"

# Extra per-architecture BOM items (not simulated as SimSS layers). p-i-n: Liu's 300 nm ITO rear electrode (sputtered over Cu).
bom_by_architecture:
  p-i-n:
    - {item: ITO_rear_electrode, volume: liu_ito_vol, price_per_cm3: liu_ito_price, utilisation: liu_ito_util,
       proxy_for: "SIMPLIFICATION: costed at Liu's 300 nm, not simulated optically (SimSS back contact = Cu only)"}

# Regions (P1). MY electricity TARIFF is sourced (tnb_mv_*) but NOT used: turning it into a cost needs the line's
# energy intensity (kWh and peak kW per m2), which no admitted source gives. Only the cost of capital is regionalised. Electricity, labour, land and
# maintenance stay at Liu's China basis (0.088 USD/W aggregate) for EVERY region, because no source gives a
# factory energy or labour INTENSITY (kWh/m2, h/m2): Liu gives only the aggregate and "450 KW for each vacuum
# machine" (no machine count); Kajal's labour line (85.23 million USD/yr for 150-100 staff) is not plausible.
# rate_basis "lending" = WDI bank lending rate (senior-debt proxy, LOWER bound). "wacc_kajal" = the only sourced
# PV-factory WACC in the library (India 2022, 10.2%), used as an UPPER-bound scenario for every region.
regions:
  MY: {lending_rate: wdi_lend_my_2025, fx_lcu_per_usd: wdi_fx_my_2025}
  CN: {lending_rate: wdi_lend_cn_2024}
  IN: {lending_rate: wdi_lend_in_2022}

# Process electricity per architecture (Tian 2020 SI). Each step maps a device layer (or fixed step) to entries.
# kind "listed": S2 value in kWh. kind "s4": Table S4 row value in MJ (/3.6 -> kWh). For vacuum steps the calibrated
# S4 value exceeds power x time (tool base load, pump-down); power x time is kept as the LOW sensitivity.
# PROXIES: IZO sputtering stands in for Liu's ITO rear electrode; Tian's per-m2 times are LAB-TO-FAB estimates for
# a tandem line; C60 is 'sputtering' in Tian (evaporated in Liu). NOT included: cleanroom/HVAC, vacuum base load,
# laser scribing, cleaning, facility lighting -> the total is a LOWER BOUND on line electricity.
process_electricity:
  p-i-n:
    - {step: "NiOx sputter (HTL)", kind: s4, power: tian_nio_power, time: tian_nio_time, listed: tian_nio_sputter_listed}
    - {step: "perovskite print", kind: listed, entry: tian_pvk_print}
    - {step: "perovskite anneal", kind: s4, power: tian_anneal_power, time: tian_anneal_time, listed: tian_anneal_listed}
    - {step: "C60", kind: listed, entry: tian_c60_sputter}
    - {step: "SnO2", kind: listed, entry: tian_sno2_sputter}
    - {step: "Cu back electrode", kind: listed, entry: tian_cu_sputter}
    - {step: "ITO rear electrode (IZO proxy)", kind: listed, entry: tian_izo_sputter}

# Non-layer bill of materials per m2 (does not depend on the design in v1).
bom_per_m2:
  - {item: FTO_glass, price: liu_fto_glass_price, utilisation: liu_fto_glass_util, quantity: 1,
     proxy_for: "front TCO glass (SimSS stack uses ITO on glass; Liu prices FTO glass)"}
  - {item: POE, price: liu_poe_price, utilisation: liu_poe_util, quantity: 1}
  - {item: back_glass, price: liu_backglass_price, utilisation: liu_backglass_util, quantity: 1}
  - {item: Al_frame, mass: liu_frame_mass, price_per_kg: liu_frame_price, utilisation: liu_frame_util}
  - {item: butyl, mass: liu_butyl_mass, price_per_kg: liu_butyl_price, utilisation: liu_butyl_util}
  - {item: junction_box, price: liu_jbox_price, utilisation: liu_jbox_util, quantity: 1}
  # back electrode: see back_electrode below (depends on the device_setup of the physics library)

# Back electrode, costed from the physics library's device_setup (L_BE_m, nkBE_file) so the cost always
# matches what SimSS simulated. price_per_toz -> USD/g with the troy ounce = 31.1034768 g (exact by definition).
back_electrode:
  nk_Cu_McPeak2015.txt:
    item: Cu
    mass_price: {mass: liu_cu_mass, price: liu_cu_price, utilisation: liu_cu_util, thickness: liu_cu_thickness}
    notes: "Liu: 8 g Cu per m2 for a 150 nm film (budgeted mass incl. evaporation losses before utilisation); scaled by L_BE / 150 nm"
  nk_Au.txt:
    item: Au
    density: au_density
    price_per_toz: wb_gold_2026_aug
    utilisation: liu_cu_util
    proxy_for: "utilisation proxied by Liu's thermally evaporated Cu (0.25)"
  # Paper B (material choice): the same metals with McPeak 2015 optics (data/nk/, CC0; built by
  # scripts/build_mcpeak_nk.py, which reproduces nk_Cu_McPeak2015.txt byte for byte). Costing is identical to the
  # entries above for the same metal; only the optics file key differs. Used by perodesign/optim/objective_b.py.
  nk_Au_McPeak2015.txt:
    item: Au
    density: au_density
    price_per_toz: wb_gold_2026_aug
    utilisation: liu_cu_util
    proxy_for: "utilisation proxied by Liu's thermally evaporated Cu (0.25)"
  nk_Ag_McPeak2015.txt:
    item: Ag
    density: ag_density
    price_per_toz: wb_silver_2026_aug
    utilisation: liu_cu_util
    proxy_for: "utilisation proxied by Liu's thermally evaporated Cu (0.25)"
