    provenance: {status: simss_default, file: L1_parameters.txt}
    params:
      nu_int_n_m_s: 1.0e+3
      nu_int_p_m_s: 1.0e+3
      N_t_int_m2: 4.0e+12
      E_t_int_eV: 4.7
      intTrapType: -1
      C_n_int_m3_s: 2.0e-14
      C_p_int_m3_s: 2.0e-14
      intTrapFile: none
    overridable:
      N_t_int_m2: {min: 1.0e+10, max: 1.0e+14, provenance: phase0_bound}
  "MAPbI3|PTAA":
    provenance: {status: simss_default, file: L2_parameters.txt}
    params:
      nu_int_n_m_s: 1.0e+3
      nu_int_p_m_s: 1.0e+3
      N_t_int_m2: 1.0e+12
      E_t_int_eV: 4.7
      intTrapType: 1
      C_n_int_m3_s: 2.0e-14
      C_p_int_m3_s: 2.0e-14
      intTrapFile: none
    overridable:
      N_t_int_m2: {min: 1.0e+10, max: 1.0e+14, provenance: phase0_bound}

  # --- p-i-n (v2): no source values exist for these pairs -> SimSS default interfaces transferred (ASSUMPTION)
