# Device-level and solver settings. ALL of these used to be inherited silently from the SimSS
# template simulation_setup.txt; they are now passed explicitly on every run (agy review 2026-09-28).
# Values = SimSS v5.36 defaults (status simss_default) except where marked phase0.
# The three solver-policy flags -Vmax 1.4 -varFile none -untilVoc 1 are fixed in code (SOLVER_ARGS).
device_setup:
  provenance: {status: simss_default, file: simulation_setup.txt}
  params:
    T_K: 295
    leftElec: -1
    W_L_eV: 4.05
    W_R_eV: 5.2
    S_n_L_m_s: -1.0e-7          # negative = infinite surface recombination (ideal ohmic contact)
    S_p_L_m_s: -1.0e-7
    S_n_R_m_s: -1.0e-7
    S_p_R_m_s: -1.0e-7
    R_shunt_Ohm_m2: -5.0e+3     # negative = infinite
    R_series_Ohm_m2: 0
    G_frac: 1
    genProfile: calc            # transfer-matrix optics
    L_TCO_m: 5.0e-8
    L_BE_m: 1.01e-7
    nkSubstrate_file: nk_SiO2.txt
    nkTCO_file: nk_ITO.txt
    nkBE_file: nk_Au.txt
    spectrum_file: AM15G.txt
    lambda_min_m: 3.5e-7
    lambda_max_m: 8.0e-7
    NP: 250
    tolPois_V: 1.0e-5
    maxDelV: 10
    maxItPois: 2000
    maxItSS: 2000
    currDiffInt: 2
    tolCurr: 1.0e-3
    tolDens: 1.0e-5
    couplePC: 4
    minAcc: 0.5
    maxAcc: 0.95
    ignoreNegDens: 1
    convVar: 1
    failureMode: 2
    grad: 4
    Vdist: 1
    preCond: 0
    Vpre_V: 0
    fixIons: 0
    Vscan: 1
    Vmin_V: -0.04
    Vstep_V: 0.02
    Vacc_V: 0
    NJV: 100
    timeout_s: 300
    pauseAtEnd: 0
    useExpData: 0
    limitDigits: 1

# Architectures: layer roles in order from the illuminated (left, TCO) side.
# Only n-i-p is supported in v1: SimSS default contacts (left = cathode, W_L 4.05 eV, W_R 5.2 eV,
# infinite surface recombination S = -1, i.e. ideal non-selective contacts; see
# docs/implementation-notes.md item 14 on why selective contacts are not modelled yet).
architectures:
  n-i-p: [ETL, absorber, HTL]
  p-i-n: [HTL, absorber, ETL, buffer]      # v2: Liu 2025 industrial stack, light enters through the HTL side

# Contact scenarios (P1, 2026-09-28). 'ideal' = architecture_setup as below (p-i-n: 'sfb' work functions = no
# contact barrier; an idealised UPPER bound). 'scaps_input_wf' = BARE-ELECTRODE work functions as CHOSEN BY AUTHORS
# of published SCAPS studies: simulation inputs, NOT measurements (agy review: "simulation inbreeding"; spread between
# papers is large, e.g. Au 4.98-5.9 eV). With SimSS (thermionic contacts, no tunnelling) a bare FTO on NiOx gives a
# blocked J-V; that run is a FAILED simulation, not a lower bound. The defensible next scenario is an EFFECTIVE
# FTO/NiOx work function from UPS/KPFM measurements (NOT yet sourced). Each value is re-read from the saved source by
# tests/test_library_v2.py::test_contact_scenario_values_are_in_their_sources.
contact_scenarios:
  ideal: {}
  scaps_input_wf:
    p-i-n:
      W_L_eV: 4.4     # FTO front anode (Liu stack: FTO/NiOx/...)
      W_R_eV: 4.0     # ITO rear electrode under Cu, contacting SnO2
    n-i-p:
      W_L_eV: 4.0     # ITO front cathode
      W_R_eV: 5.1     # Au back anode
    provenance:
      FTO_4.4: {source: wf_fto_au_mi2021.txt, doi: 10.3390/mi12121508, quote: "Metal work function ϕ (eV) 5.1 4.4", note: "table columns Au | FTO"}
      ITO_4.0: {source: wf_ito_au_srep2023.txt, doi: 10.1038/s41598-023-28506-2, quote: "indium dioxide with a WF of 4.0 eV acts as the front contact"}
      Au_5.1: {source: wf_ito_au_srep2023.txt, doi: 10.1038/s41598-023-28506-2, quote: "the gold was considered as the rear contact with a work function (WF) of 5.1 eV"}
      Cu_4.6: {source: wf_metals_nano2021.txt, doi: 10.3390/nano11051218, quote: "Metal work function (eV) 5.1 4.7 4.8 4.6 5.0", note: "Cu = 4th column; not used (ITO is the contact to SnO2)"}

# Per-architecture overrides of device_setup (v2). p-i-n: the left (illuminated) contact is the anode;
# work functions 'sfb' = semi-flat band to the adjacent layer (no invented work functions); back contact
# Cu 150 nm (thickness from Liu 2025 Fig. 1 caption; optics McPeak 2015, CC0; see data/nk/README.md).
# SIMPLIFICATION: Liu's 300 nm ITO under the Cu is costed but not simulated optically.
architecture_setup:
  n-i-p: {}
  p-i-n:
    leftElec: 1
    Vscan: -1                  # SimSS rule (exit 91): with untilVoc = 1, leftElec x Vscan must be negative
    W_L_eV: sfb
    W_R_eV: sfb
    nkBE_file: nk_Cu_McPeak2015.txt
    L_BE_m: 1.5e-7
