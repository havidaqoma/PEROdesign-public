# PeroDesign material + interface library, version 1 (P1).
#
# Units are part of every key name (SI, as SIMsalabim uses): _m, _nm, _eV, _m3 (= m^-3),
# _m2 (= m^-2), _m2_Vs, _m3_s, _m_s. Integers without a unit are SimSS switches.
#
# PROVENANCE (read before using any number in a paper):
#   status "simss_default"  = copied from the SIMsalabim v5.36 default parameter files
#                              (F:/SIMsalabim/src/SimSS/L{1,2,3}_parameters.txt, commit d48e0e7,
#                              dumped to phase0/sim_bench/simss_default_params.json on 2026-09-28).
#                              These are the simulator authors' example values, NOT literature-verified
#                              material data. They reproduce the Phase 0 grid (22.51% at 500/10/10 nm).
#   status "phase0_bound"   = design bound chosen in Phase 0 from convergence / toy-task scope,
#                              not from literature.
# Replacing these with literature-sourced values (DOI per value) is a P2 task (gate G1).

library_version: 1
simss_version: "5.36"

materials:
  C60:
    roles: [ETL]
    provenance: {status: simss_default, file: L1_parameters.txt}
    thickness_nm: {min: 10, max: 100, provenance: phase0_bound}
    params:
      eps_r: 5
      E_c_eV: 4.0
      E_v_eV: 5.9
      N_c_m3: 5.0e+26
      N_D_m3: 0
      N_A_m3: 0
      mu_n_m2_Vs: 1.0e-6
      mu_p_m2_Vs: 1.0e-9
      N_anion_m3: 0
      N_cation_m3: 0
      mu_anion_m2_Vs: 1.0e-11
      mu_cation_m2_Vs: 1.0e-11
      ionsMayEnter: 0
      layerGen: 0
      k_direct_m3_s: 1.0e-17
      N_t_bulk_m3: 0
      C_n_bulk_m3_s: 2.0e-14
      C_p_bulk_m3_s: 2.0e-14
      E_t_bulk_eV: 4.7
      bulkTrapType: -1
      nk_file: nk_C60_1.txt
      # --- previously inherited silently from the template (agy review 2026-09-28); now explicit
      mobnDep: 0
      mobpDep: 0
      gamma_n_sqrt_m_V: 0
      gamma_p_sqrt_m_V: 0
      G_ehp_per_m3_s: 0
      fieldDepG: 0
      P0: 0
      a_m: 1.0e-9
      thermLengDist: 2
      k_f_per_s: 1.0e+6
      preLangevin: 1
      useLangevin: 0
      bulkTrapFile: none
    overridable: {}

  MAPbI3:
    roles: [absorber]
    provenance: {status: simss_default, file: L2_parameters.txt}
    thickness_nm: {min: 200, max: 1000, provenance: phase0_bound}
    params:
      eps_r: 24
      E_c_eV: 3.9
      E_v_eV: 5.53
      N_c_m3: 2.2e+24
      N_D_m3: 0
      N_A_m3: 0
      mu_n_m2_Vs: 1.0e-4
      mu_p_m2_Vs: 1.0e-4
      N_anion_m3: 5.0e+21
      N_cation_m3: 3.0e+21
      mu_anion_m2_Vs: 5.0e-11
      mu_cation_m2_Vs: 1.0e-30
      ionsMayEnter: 1
      layerGen: 1
      k_direct_m3_s: 1.0e-17
      N_t_bulk_m3: 1.0e+20
      C_n_bulk_m3_s: 5.0e-14
      C_p_bulk_m3_s: 2.0e-14
      E_t_bulk_eV: 4.7
      bulkTrapType: -1
      nk_file: nk_MAPI.txt
      # --- previously inherited silently from the template (agy review 2026-09-28); now explicit
      mobnDep: 0
      mobpDep: 0
      gamma_n_sqrt_m_V: 0
      gamma_p_sqrt_m_V: 0
      G_ehp_per_m3_s: 0
      fieldDepG: 0
      P0: 0
      a_m: 1.0e-9
      thermLengDist: 2
      k_f_per_s: 1.0e+6
      preLangevin: 1
      useLangevin: 0
      bulkTrapFile: none
    # Ranges used in the Phase 0 simulator benchmark (phase0/scripts/simss_bench.py RANGES);
    # convergence-tested, not literature-sourced.
    overridable:
      N_t_bulk_m3: {min: 1.0e+19, max: 1.0e+22, provenance: phase0_bound}
      mu_n_m2_Vs: {min: 1.0e-5, max: 1.0e-3, provenance: phase0_bound}
      mu_p_m2_Vs: {min: 1.0e-5, max: 1.0e-3, provenance: phase0_bound}

  PTAA:
    roles: [HTL]
    provenance: {status: simss_default, file: L3_parameters.txt}
    thickness_nm: {min: 10, max: 70, provenance: phase0_bound}
    params:
      eps_r: 3
      E_c_eV: 2.25
      E_v_eV: 5.4
      N_c_m3: 1.0e+26
      N_D_m3: 0
      N_A_m3: 0
      mu_n_m2_Vs: 1.0e-9
      mu_p_m2_Vs: 1.0e-7
      N_anion_m3: 0
      N_cation_m3: 0
      mu_anion_m2_Vs: 1.0e-11
      mu_cation_m2_Vs: 1.0e-11
      ionsMayEnter: 0
      layerGen: 0
      k_direct_m3_s: 1.0e-17
      N_t_bulk_m3: 0
      C_n_bulk_m3_s: 2.0e-14
      C_p_bulk_m3_s: 2.0e-14
      E_t_bulk_eV: 4.7
      bulkTrapType: -1
      nk_file: nk_PTAA.txt
      # --- previously inherited silently from the template (agy review 2026-09-28); now explicit
      mobnDep: 0
      mobpDep: 0
      gamma_n_sqrt_m_V: 0
      gamma_p_sqrt_m_V: 0
      G_ehp_per_m3_s: 0
      fieldDepG: 0
      P0: 0
      a_m: 1.0e-9
      thermLengDist: 2
      k_f_per_s: 1.0e+6
      preLangevin: 1
      useLangevin: 0
      bulkTrapFile: none
    overridable: {}

# Interface parameters belong to a PAIR of materials, left|right in stack order.
# (SimSS stores them in the left layer's file as "interface with the layer to the right".)
interfaces:
  "C60|MAPbI3":
    provenance: {status: simss_default, file: L1_parameters.txt}
    params:
      nu_int_n_m_s: 1.0e+3
      nu_int_p_m_s: 1.0e+3
      N_t_int_m2: 4.0e+12
      E_t_int_eV: 4.7
      intTrapType: -1
      C_n_int_m3_s: 2.0e-14
      C_p_int_m3_s: 2.0e-14
      intTrapFile: none
    overridable:
      N_t_int_m2: {min: 1.0e+10, max: 1.0e+14, provenance: phase0_bound}
  "MAPbI3|PTAA":
    provenance: {status: simss_default, file: L2_parameters.txt}
    params:
      nu_int_n_m_s: 1.0e+3
      nu_int_p_m_s: 1.0e+3
      N_t_int_m2: 1.0e+12
      E_t_int_eV: 4.7
      intTrapType: 1
      C_n_int_m3_s: 2.0e-14
      C_p_int_m3_s: 2.0e-14
      intTrapFile: none
    overridable:
      N_t_int_m2: {min: 1.0e+10, max: 1.0e+14, provenance: phase0_bound}

# Device-level and solver settings. ALL of these used to be inherited silently from the SimSS
# template simulation_setup.txt; they are now passed explicitly on every run (agy review 2026-09-28).
# Values = SimSS v5.36 defaults (status simss_default) except where marked phase0.
# The three solver-policy flags -Vmax 1.4 -varFile none -untilVoc 1 are fixed in code (SOLVER_ARGS).
device_setup:
  provenance: {status: simss_default, file: simulation_setup.txt}
  params:
    T_K: 295
    leftElec: -1
    W_L_eV: 4.05
    W_R_eV: 5.2
    S_n_L_m_s: -1.0e-7          # negative = infinite surface recombination (ideal ohmic contact)
    S_p_L_m_s: -1.0e-7
    S_n_R_m_s: -1.0e-7
    S_p_R_m_s: -1.0e-7
    R_shunt_Ohm_m2: -5.0e+3     # negative = infinite
    R_series_Ohm_m2: 0
    G_frac: 1
    genProfile: calc            # transfer-matrix optics
    L_TCO_m: 5.0e-8
    L_BE_m: 1.01e-7
    nkSubstrate_file: nk_SiO2.txt
    nkTCO_file: nk_ITO.txt
    nkBE_file: nk_Au.txt
    spectrum_file: AM15G.txt
    lambda_min_m: 3.5e-7
    lambda_max_m: 8.0e-7
    NP: 250
    tolPois_V: 1.0e-5
    maxDelV: 10
    maxItPois: 2000
    maxItSS: 2000
    currDiffInt: 2
    tolCurr: 1.0e-3
    tolDens: 1.0e-5
    couplePC: 4
    minAcc: 0.5
    maxAcc: 0.95
    ignoreNegDens: 1
    convVar: 1
    failureMode: 2
    grad: 4
    Vdist: 1
    preCond: 0
    Vpre_V: 0
    fixIons: 0
    Vscan: 1
    Vmin_V: -0.04
    Vstep_V: 0.02
    Vacc_V: 0
    NJV: 100
    timeout_s: 300
    pauseAtEnd: 0
    useExpData: 0
    limitDigits: 1

# Architectures: layer roles in order from the illuminated (left, TCO) side.
# Only n-i-p is supported in v1: SimSS default contacts (left = cathode, W_L 4.05 eV, W_R 5.2 eV,
# infinite surface recombination S = -1, i.e. ideal non-selective contacts; see
# docs/implementation-notes.md item 14 on why selective contacts are not modelled yet).
architectures:
  n-i-p: [ETL, absorber, HTL]
