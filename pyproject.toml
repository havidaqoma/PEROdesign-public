[project]
name = "perodesign"
version = "0.1.0"
description = "Physics- and cost-verified RL environment for perovskite device design"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["perodesign*"]

[tool.setuptools.package-data]
perodesign = ["library/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["simss: runs the real SIMsalabim binary (skipped if not installed)",
           "slow: BoTorch mixed-BO smoke on a synthetic objective (~1-3 min)"]
addopts = "-ra"

[tool.coverage.run]
source = ["perodesign"]
